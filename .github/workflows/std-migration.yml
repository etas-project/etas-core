name: Standard library migration baseline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup update stable --no-self-update
      - name: Verify canonical inventory and module reports
        run: cargo test --locked -p etas_std --test migration_baseline
      - name: Export and compare across processes
        run: |
          mkdir -p target/std-migration
          cargo run --locked -p etas_std --example std_migration_baseline -- export target/std-migration/legacy.json
          target/debug/examples/std_migration_baseline export target/std-migration/candidate.json
          target/debug/examples/std_migration_baseline compare target/std-migration/legacy.json target/std-migration/candidate.json > target/std-migration/report.json
          cmp target/std-migration/legacy.json target/std-migration/candidate.json
      - name: Preserve migration inventory and module coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: std-migration-baseline
          path: target/std-migration/
          if-no-files-found: error
