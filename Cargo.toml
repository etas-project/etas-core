[workspace]
members = [
    "crates/etas_builtin",
    "crates/etas_cache",
    "crates/etas_core",
    "crates/etas_host",
    "crates/etas_package_metadata",
    "crates/etas_std",
    "crates/etas_utils",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/etas-project/etas-core"

[workspace.dependencies]
etas_builtin = { path = "crates/etas_builtin" }
etas_cache = { path = "crates/etas_cache" }
etas_core = { path = "crates/etas_core" }
etas_host = { path = "crates/etas_host" }
etas_package_metadata = { path = "crates/etas_package_metadata" }
etas_std = { path = "crates/etas_std" }
etas_utils = { path = "crates/etas_utils" }
blake3 = "1"
prost = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "process", "rt", "rt-multi-thread", "time"] }
webpki-roots = "1"
zstd = "0.13"
